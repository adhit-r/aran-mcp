openapi: 3.0.3
info:
  title: aran-mcp API
  description: |
    MCP Server Management and Security Platform API.
    
    This API provides endpoints for managing Model Context Protocol (MCP) servers,
    monitoring their health, running security tests, and managing alerts.
    
    ## Authentication
    
    The API supports multiple authentication methods:
    
    - **API Key**: Pass your API key in the `X-API-Key` header or as a Bearer token
    - **JWT**: Pass a valid JWT token in the `Authorization: Bearer <token>` header
    - **Neon Auth**: Use Neon Auth integration for authentication
    
    ## Rate Limiting
    
    The API implements rate limiting to protect against abuse:
    - Global: 1000 requests/minute
    - Per IP: 100 requests/minute
    - Per User: 200 requests/minute
    - Endpoint-specific limits vary
    
    Rate limit headers are included in responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Remaining requests in window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
    
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/adhit-r/aran-mcp
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.aran-mcp.example.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: MCP Servers
    description: MCP server management endpoints
  - name: Search
    description: Search and filtering endpoints
  - name: Alerts
    description: Alert management endpoints
  - name: Security
    description: Security testing endpoints
  - name: Discovery
    description: MCP server discovery endpoints
  - name: API Keys
    description: API key management endpoints
  - name: Rate Limiting
    description: Rate limit configuration endpoints

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check the health status of the API and its dependencies
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: API is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register
      description: Register a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mcp/servers:
    get:
      tags:
        - MCP Servers
      summary: List all MCP servers
      description: Retrieve a list of all registered MCP servers
      operationId: listServers
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of servers to return
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Number of servers to skip
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [online, offline, error, unknown]
        - name: type
          in: query
          description: Filter by type
          schema:
            type: string
            enum: [filesystem, database, api, custom]
      responses:
        '200':
          description: List of MCP servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MCPServer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - MCP Servers
      summary: Register a new MCP server
      description: Register a new MCP server for monitoring
      operationId: createServer
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: Server created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/mcp/servers/{id}:
    get:
      tags:
        - MCP Servers
      summary: Get server by ID
      description: Retrieve a specific MCP server by its ID
      operationId: getServer
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Server ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - MCP Servers
      summary: Update server
      description: Update an existing MCP server
      operationId: updateServer
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Server ID (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: Server updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - MCP Servers
      summary: Delete server
      description: Delete an MCP server (soft delete)
      operationId: deleteServer
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Server ID (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Server deleted successfully
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/servers/search:
    get:
      tags:
        - Search
      summary: Search servers (GET)
      description: Search MCP servers using query parameters
      operationId: searchServersGet
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status (comma-separated)
          schema:
            type: string
        - name: type
          in: query
          description: Filter by type (comma-separated)
          schema:
            type: string
        - name: tags
          in: query
          description: Filter by tags (comma-separated)
          schema:
            type: string
        - name: date_from
          in: query
          description: Filter by start date (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Filter by end date (RFC3339 or YYYY-MM-DD)
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [name, created_at, updated_at, status, type]
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          description: Results per page
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

    post:
      tags:
        - Search
      summary: Search servers (POST)
      description: Search MCP servers with advanced filters
      operationId: searchServersPost
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /api/v1/servers/quick-search:
    get:
      tags:
        - Search
      summary: Quick search
      description: Perform a simple text search across servers
      operationId: quickSearch
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPServer'
                  count:
                    type: integer
                  query:
                    type: string

  /api/v1/servers/recent:
    get:
      tags:
        - Search
      summary: Get recent servers
      description: Get recently added or updated servers
      operationId: getRecentServers
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          description: Time period (1h, 24h, 7d, 30d) or RFC3339 timestamp
          schema:
            type: string
            default: 24h
      responses:
        '200':
          description: Recent servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPServer'
                  count:
                    type: integer
                  since:
                    type: string
                    format: date-time

  /api/v1/alerts:
    get:
      tags:
        - Alerts
      summary: List alerts
      description: Retrieve a list of alerts
      operationId: listAlerts
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low, info]
        - name: is_read
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'

  /api/v1/alerts/{id}/resolve:
    post:
      tags:
        - Alerts
      summary: Resolve an alert
      description: Mark an alert as resolved
      operationId: resolveAlert
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'

  /api/v1/mcp/discover:
    post:
      tags:
        - Discovery
      summary: Discover MCP server
      description: Discover capabilities of an MCP server
      operationId: discoverServer
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the MCP server to discover
      responses:
        '200':
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResult'

  /api/v1/api-keys:
    get:
      tags:
        - API Keys
      summary: List API keys
      description: List all API keys for the organization
      operationId: listApiKeys
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: include_revoked
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
                  count:
                    type: integer

    post:
      tags:
        - API Keys
      summary: Create API key
      description: Create a new API key
      operationId: createApiKey
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'

  /api/v1/api-keys/{id}:
    get:
      tags:
        - API Keys
      summary: Get API key
      description: Get API key details by ID
      operationId: getApiKey
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'

    put:
      tags:
        - API Keys
      summary: Update API key
      description: Update API key settings
      operationId: updateApiKey
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAPIKeyRequest'
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'

    delete:
      tags:
        - API Keys
      summary: Revoke API key
      description: Revoke an API key
      operationId: revokeApiKey
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/api-keys/{id}/regenerate:
    post:
      tags:
        - API Keys
      summary: Regenerate API key
      description: Regenerate the secret for an existing API key
      operationId: regenerateApiKey
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'

  /api/v1/rate-limit/stats:
    get:
      tags:
        - Rate Limiting
      summary: Get rate limit stats
      description: Get current rate limiter statistics
      operationId: getRateLimitStats
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Rate limit statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip_entries:
                    type: integer
                  user_entries:
                    type: integer
                  endpoint_entries:
                    type: object

  /api/v1/rate-limit/config:
    get:
      tags:
        - Rate Limiting
      summary: Get rate limit config
      description: Get current rate limit configuration
      operationId: getRateLimitConfig
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Rate limit configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitConfig'

    put:
      tags:
        - Rate Limiting
      summary: Update rate limit config
      description: Update rate limit configuration
      operationId: updateRateLimitConfig
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitConfig'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  config:
                    $ref: '#/components/schemas/RateLimitConfig'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Service is healthy
        checks:
          type: object
          additionalProperties:
            type: object

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 8
        organization_name:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, user, viewer]
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MCPServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
        type:
          type: string
          enum: [filesystem, database, api, custom]
        status:
          type: string
          enum: [online, offline, error, unknown]
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        metadata:
          type: object
        last_checked_at:
          type: string
          format: date-time
        response_time_ms:
          type: integer
        uptime_percentage:
          type: number
          format: float
        error_rate:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateServerRequest:
      type: object
      required:
        - name
        - url
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
        description:
          type: string
        type:
          type: string
          enum: [filesystem, database, api, custom]

    UpdateServerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        url:
          type: string
          format: uri
        description:
          type: string
        type:
          type: string
          enum: [filesystem, database, api, custom]

    SearchRequest:
      type: object
      properties:
        query:
          type: string
        status:
          type: array
          items:
            type: string
            enum: [online, offline, error, unknown]
        type:
          type: array
          items:
            type: string
            enum: [filesystem, database, api, custom]
        tags:
          type: array
          items:
            type: string
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        sort_by:
          type: string
          enum: [name, created_at, updated_at, status, type]
        sort_order:
          type: string
          enum: [asc, desc]
        limit:
          type: integer
          default: 20
          maximum: 100
        offset:
          type: integer
          default: 0
        page:
          type: integer

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              server:
                $ref: '#/components/schemas/MCPServer'
              relevance:
                type: number
              highlight_name:
                type: string
              highlight_desc:
                type: string
        total:
          type: integer
        total_pages:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        filters:
          $ref: '#/components/schemas/SearchRequest'

    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        type:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        message:
          type: string
        is_read:
          type: boolean
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          format: uuid
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiscoveryResult:
      type: object
      properties:
        url:
          type: string
          format: uri
        status:
          type: string
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
        resources:
          type: array
          items:
            type: object
        prompts:
          type: array
          items:
            type: object
        error:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        key_prefix:
          type: string
          description: First 8 characters of the key
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
        last_used_at:
          type: string
          format: date-time
        last_used_ip:
